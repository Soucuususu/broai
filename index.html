
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090F">
<title>BroAI — Sua inteligência artificial</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #09090f;
  --panel: #14141e;
  --panel2: #191925;
  --border: #2c2b3b;
  --text: #f4f2ff;
  --muted: #a4a1ba;
  --purple: #8b5cf6;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, sans-serif;
  display: flex;
  flex-direction: column;
}

header {
  width: 100%;
  padding: 15px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid #242431;
  background: rgba(9, 9, 15, 0.96);
}

.logo {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  font-size: 23px;
  font-weight: 800;
  background: linear-gradient(135deg, #a78bfa, #5b21b6);
  box-shadow: 0 0 25px #8b5cf626;
}

.brand {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.7px;
}

.subtitle {
  color: var(--muted);
  font-size: 12px;
  margin-top: 2px;
}

.gradient {
  background: linear-gradient(90deg, #c4b5fd, #8b5cf6);
  color: transparent;
  background-clip: text;
  -webkit-background-clip: text;
}

.status {
  margin-left: auto;
  color: #b9b2d4;
  font-size: 11px;
  white-space: nowrap;
}

.status::before {
  content: "";
  display: inline-block;
  width: 7px;
  height: 7px;
  margin-right: 6px;
  border-radius: 50%;
  background: #a78bfa;
}

main {
  width: 100%;
  max-width: 850px;
  flex: 1;
  min-height: 0;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
}

#chat {
  flex: 1;
  min-height: 180px;
  overflow-y: auto;
  padding: 24px 18px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  scroll-behavior: smooth;
}

.welcome {
  margin: auto 0;
  padding: 30px 0;
  text-align: center;
}

.brain {
  width: 68px;
  height: 68px;
  margin: 0 auto 22px;
  display: grid;
  place-items: center;
  border-radius: 23px;
  font-size: 38px;
  color: #d8caff;
  background: linear-gradient(135deg, #24183e, #14101f);
  border: 1px solid #49316f;
  box-shadow: 0 0 45px #8b5cf620;
}

h1 {
  margin: 0 0 12px;
  font-size: clamp(28px, 7vw, 43px);
  line-height: 1.2;
  letter-spacing: -1.5px;
}

.welcome p {
  max-width: 410px;
  margin: 0 auto;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.7;
}

.suggestions {
  width: 100%;
  max-width: 510px;
  margin: 27px auto 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.suggestion {
  min-height: 65px;
  padding: 13px;
  text-align: left;
  color: #e5defa;
  background: #11111b;
  border: 1px solid var(--border);
  border-radius: 14px;
  font: inherit;
  font-size: 12px;
  cursor: pointer;
  transition: 0.2s;
}

.suggestion:hover {
  background: #1d1730;
  border-color: var(--purple);
  transform: translateY(-2px);
}

.message {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.avatar {
  width: 33px;
  height: 33px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: #25193c;
  color: #d6c7ff;
  font-weight: 700;
}

.user {
  flex-direction: row-reverse;
}

.user .avatar {
  background: #29283a;
  color: white;
}

.bubble {
  max-width: calc(100% - 43px);
  padding: 12px 15px;
  border-radius: 4px 16px 16px 16px;
  background: var(--panel2);
  border: 1px solid #242432;
  font-size: 14px;
  line-height: 1.7;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.user .bubble {
  background: #28203b;
  border-color: #403052;
  border-radius: 16px 4px 16px 16px;
}

#typing {
  padding: 0 18px 12px;
  color: var(--muted);
  font-size: 12px;
}

.typing-dots {
  display: inline-flex;
  gap: 4px;
  margin-left: 5px;
}

.typing-dots span {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #a78bfa;
  animation: pulse 1s infinite alternate;
}

.typing-dots span:nth-child(2) {
  animation-delay: .2s;
}

.typing-dots span:nth-child(3) {
  animation-delay: .4s;
}

@keyframes pulse {
  from { opacity: .3; transform: translateY(0); }
  to { opacity: 1; transform: translateY(-3px); }
}

.composer-wrap {
  width: 100%;
  padding: 12px 15px 8px;
}

.composer {
  max-width: 760px;
  margin: 0 auto;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  padding: 10px;
  border: 1px solid #383548;
  border-radius: 19px;
  background: var(--panel);
  transition: border-color .2s;
}

.composer:focus-within {
  border-color: var(--purple);
}

textarea {
  flex: 1;
  min-width: 0;
  max-height: 140px;
  resize: none;
  padding: 10px 5px;
  border: 0;
  outline: 0;
  background: transparent;
  color: white;
  font: inherit;
  font-size: 14px;
}

textarea::placeholder {
  color: #858197;
}

#send {
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  border: 0;
  border-radius: 13px;
  background: var(--purple);
  color: white;
  font-size: 23px;
  cursor: pointer;
}

#send:disabled {
  opacity: .5;
  cursor: wait;
}

#send:hover:not(:disabled) {
  background: #9c75ff;
}

footer {
  padding: 8px 12px 13px;
  color: #77758b;
  font-size: 10px;
  text-align: center;
}

@media (max-width: 420px) {
  header {
    padding: 12px;
  }

  .status {
    font-size: 10px;
  }

  #chat {
    padding: 18px 12px;
  }

  .welcome {
    padding: 18px 0;
  }

  .suggestions {
    grid-template-columns: 1fr;
    gap: 8px;
    margin-top: 20px;
  }

  .suggestion {
    min-height: 48px;
  }

  .composer-wrap {
    padding: 9px;
  }
}
</style>
</head>

<body>
<header>
  <div class="logo">B</div>
  <div>
    <div class="brand">BroAI <span class="gradient">✦</span></div>
    <div class="subtitle">Sua inteligência. Suas ideias.</div>
  </div>
  <div class="status">Online</div>
</header>

<main>
  <section id="chat">
    <div class="welcome" id="welcome">
      <div class="brain">✦</div>
      <h1>O que vamos<br><span class="gradient">descobrir?</span></h1>
      <p>
        Seu espaço para aprender, criar e explorar novas ideias.
        Por onde vamos começar?
      </p>

      <div class="suggestions">
        <button class="suggestion"
          data-prompt="Faça uma preparação para os meus estudos.">
          ◈ &nbsp; Preparação para estudos
        </button>
        <button class="suggestion"
          data-prompt="Prepare uma rotina ideal para mim.">
          ✦ &nbsp; Criar uma rotina
        </button>
        <button class="suggestion"
          data-prompt="Explique como funciona uma inteligência artificial.">
          ✦ &nbsp; Explorar IA
        </button>
        <button class="suggestion"
          data-prompt="Me ajude a organizar meus objetivos.">
          ◈ &nbsp; Organizar objetivos
        </button>
      </div>
    </div>
  </section>

  <div id="typing" hidden>
    BroAI está pensando
    <span class="typing-dots">
      <span></span><span></span><span></span>
    </span>
  </div>

  <div class="composer-wrap">
    <form class="composer" id="form">
      <textarea
        id="input"
        rows="1"
        maxlength="4000"
        placeholder="Pergunte qualquer coisa..."
        aria-label="Sua mensagem"
      ></textarea>
      <button id="send" type="submit" aria-label="Enviar">↑</button>
    </form>
  </div>

  <footer>
    A BroAI ainda está em desenvolvimento.
  </footer>
</main>

<script>
const chat = document.querySelector("#chat");
const form = document.querySelector("#form");
const input = document.querySelector("#input");
const typing = document.querySelector("#typing");
const send = document.querySelector("#send");

function addMessage(text, who) {
  document.querySelector("#welcome")?.remove();

  const row = document.createElement("div");
  row.className = "message " + who;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = who === "user" ? "U" : "✦";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  row.append(avatar, bubble);
  chat.append(row);
  chat.scrollTop = chat.scrollHeight;
}

async function submitMessage(text) {
  text = text.trim();

  if (!text || send.disabled) return;

  addMessage(text, "user");

  input.value = "";
  input.style.height = "auto";
  send.disabled = true;
  typing.hidden = false;
  chat.scrollTop = chat.scrollHeight;

  await new Promise(resolve => setTimeout(resolve, 600));

  typing.hidden = true;

  addMessage(
    "Recebi sua mensagem! Minha interface está funcionando. Agora precisamos conectar meu modelo de inteligência artificial para gerar respostas reais.",
    "assistant"
  );

  send.disabled = false;
  input.focus();
}

form.addEventListener("submit", event => {
  event.preventDefault();
  submitMessage(input.value);
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height =
    Math.min(input.scrollHeight, 140) + "px";
});

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});

document.querySelectorAll(".suggestion").forEach(button => {
  button.addEventListener("click", () => {
    submitMessage(button.dataset.prompt);
  });
});
</script>
</body>
</html>
